<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>GitHub flat demo — Zoom MS-60B+ Patch Studio</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <style>
      /* The demo's own chrome: GitHub dark, flat */
      :root { --bg: #0d1117; --border: #30363d; --fg: #e6edf3; --muted: #7d8590; }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body { display: flex; flex-direction: column; margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
      button { font: inherit; color: inherit; }
      .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 12px 16px; background: #010409; border-bottom: 1px solid var(--border); }
      .bar h1 { margin: 0; font-size: 14px; font-weight: 600; }
      .bar h1 span { color: var(--muted); font-weight: 400; }
      .group { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
      .group > b { color: var(--muted); font-size: 12px; font-weight: 400; }
      .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
      .seg button { padding: 4px 12px; background: #21262d; border: 0; border-left: 1px solid var(--border); cursor: pointer; font-size: 12px; }
      .seg button:first-child { border-left: 0; }
      .seg button:hover { background: #30363d; }
      .seg button[aria-pressed="true"] { background: #1f6feb; color: #fff; font-weight: 600; }
      .note { flex: 1 1 100%; margin: 0; color: var(--muted); font-size: 12px; }
      .stage { flex: 1; display: flex; justify-content: center; min-height: 0; padding: 16px; }
      iframe { width: 100%; height: 100%; min-height: 480px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); visibility: hidden; }
      iframe.ready { visibility: visible; }
      .stage[data-width="mobile"] iframe { max-width: 390px; }
      .stage[data-width="tablet"] iframe { max-width: 820px; }
      @media (max-width: 600px) { .stage { padding: 8px; } }
    </style>
  </head>
  <body>
    <div class="bar">
      <h1>GitHub flat demo <span>· the real pages, flat colours, no gradients or glows</span></h1>
      <div class="group"><b>Variant</b><div class="seg" id="variant" role="group" aria-label="Variant"></div></div>
      <div class="group"><b>Page</b><div class="seg" id="page" role="group" aria-label="Page"></div></div>
      <div class="group"><b>Width</b><div class="seg" id="width" role="group" aria-label="Width"></div></div>
      <div class="group"><div class="seg"><button type="button" id="stage-toggle" aria-pressed="false">Old Stage theme</button></div></div>
      <p class="note" id="note"></p>
    </div>
    <div class="stage" id="stage"><iframe id="frame" title="Page preview"></iframe></div>

    <script>
      // The demo loads a real page in the frame, turns its theme.css (Primer, the site theme) off and adds base.css plus a variant.
      // "Old Stage theme" puts back the lime stage.css the site used before, for comparison. The live pages do not change.
      const VARIANTS = {
        primer: { label: 'Primer', note: 'The site theme now. GitHub dark as it is: blue links and focus, green primary button, coral tab bar, 6px corners.' },
        dimmed: { label: 'Dimmed', note: 'GitHub dark dimmed: softer greys and lower contrast, same structure.' },
        lime: { label: 'Lime', note: 'GitHub dark structure with the brand lime as a flat accent (buttons, tab bar, selection), no glow, 8px corners.' },
        contrast: { label: 'High contrast', note: 'GitHub dark high contrast: near-black, bright text, visible borders, 4px corners.' }
      };
      const PAGES = { 'index.html': 'Effects', 'builder.html': 'Patch builder', 'tones.html': 'Tone ideas', 'pedal-manager.html': 'Pedal manager' };
      const WIDTHS = { desktop: 'Desktop', tablet: 'Tablet', mobile: 'Mobile' };
      const params = new URLSearchParams(location.hash.slice(1));
      const pick = (key, options, fallback) => Object.hasOwn(options, params.get(key)) ? params.get(key) : fallback;
      const state = { variant: pick('v', VARIANTS, 'primer'), page: pick('p', PAGES, 'index.html'), width: pick('w', WIDTHS, 'desktop'), stage: false };
      const frame = document.getElementById('frame');

      function seg(id, options, key) {
        const el = document.getElementById(id);
        el.innerHTML = Object.entries(options).map(([k, o]) => `<button type="button" data-k="${k}">${typeof o === 'string' ? o : o.label}</button>`).join('');
        el.addEventListener('click', event => {
          const button = event.target.closest('button');
          if (!button) return;
          state[key] = button.dataset.k;
          if (key === 'variant') state.stage = false;
          if (key === 'page') load(); else apply();
          sync();
        });
      }
      function sync() {
        for (const key of ['variant', 'page', 'width'])
          document.querySelectorAll(`#${key} button`).forEach(b => b.setAttribute('aria-pressed', b.dataset.k === state[key]));
        document.getElementById('stage-toggle').setAttribute('aria-pressed', state.stage);
        document.getElementById('stage').dataset.width = state.width;
        document.getElementById('note').textContent = state.stage ? 'The old lime Stage theme (stage.css), for comparison. The site now uses Primer.' : VARIANTS[state.variant].note;
        history.replaceState(null, '', `#v=${state.variant}&p=${state.page}&w=${state.width}`);
      }
      // Swap the theme inside the frame (same origin): theme.css off, then base.css and the variant, or stage.css
      function apply() {
        const doc = frame.contentDocument;
        if (!doc?.head) return;
        doc.querySelectorAll('link[data-demo]').forEach(l => l.remove());
        doc.querySelectorAll('link[href*="theme.css"]').forEach(l => { l.disabled = true; });
        for (const file of state.stage ? ['../stage.css'] : ['base.css', `${state.variant}.css`]) {
          const link = doc.createElement('link');
          link.rel = 'stylesheet';
          link.href = new URL(`github/${file}`, location.href).href;
          link.dataset.demo = '';
          doc.head.append(link);
        }
        frame.classList.add('ready');
      }
      function load() { frame.classList.remove('ready'); frame.src = `../${state.page}`; }
      frame.addEventListener('load', () => {
        apply();
        // A tab clicked inside the frame opens that page with the same variant
        const file = frame.contentWindow.location.pathname.split('/').pop();
        if (Object.hasOwn(PAGES, file) && file !== state.page) { state.page = file; sync(); }
      });
      document.getElementById('stage-toggle').addEventListener('click', () => { state.stage = !state.stage; apply(); sync(); });

      seg('variant', VARIANTS, 'variant');
      seg('page', PAGES, 'page');
      seg('width', WIDTHS, 'width');
      sync();
      load();
    </script>
  </body>
</html>
