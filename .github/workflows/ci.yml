name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Round-trip every reference patch byte for byte
        run: node tools/zptc.mjs roundtrip patches/0*
      - name: Advice engine and starter chains
        run: node tools/advice-test.mjs
